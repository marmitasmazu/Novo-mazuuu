<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#A8431F">
  <title>Página não encontrada – Marmitas Mazu</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🍽️%3C/text%3E%3C/svg%3E">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
      font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: #3A1A0C; background: #F4F3E3; line-height: 1.6;
    }
    .box {
      width: 100%; max-width: 420px; background: #fff;
      border-radius: 20px; padding: 40px 28px;
      box-shadow: 0 16px 40px rgba(0,0,0,.12);
    }
    .emoji { font-size: 64px; line-height: 1; margin-bottom: 12px; }
    .code { font-family: Georgia, 'Playfair Display', serif; font-size: 72px; font-weight: 700; color: #A8431F; line-height: 1; }
    h1 { font-family: Georgia, 'Playfair Display', serif; font-size: 24px; margin: 12px 0 8px; }
    p { color: #6B5446; font-size: 15px; margin-bottom: 28px; }
    .btn {
      display: block; width: 100%; padding: 14px 20px; border-radius: 999px;
      font-weight: 600; font-size: 15px; text-decoration: none; margin-top: 10px;
    }
    .btn--primary { background: #A8431F; color: #fff; }
    .btn--primary:active { background: #7E3115; }
    .btn--wa { background: #fff; color: #A8431F; border: 2px solid #E4E0CC; }
    .btn--wa:active { background: #F4F3E3; }
  </style>
</head>
<body>
  <main class="box">
    <div class="emoji">🍽️</div>
    <div class="code">404</div>
    <h1>Página não encontrada</h1>
    <p>Esse endereço não existe ou mudou de lugar. Volte para o cardápio e monte sua marmita.</p>
    <a class="btn btn--primary" id="home" href="/">Voltar para o cardápio</a>
    <a class="btn btn--wa" href="https://wa.me/5542998152403" target="_blank" rel="noopener">Falar pelo WhatsApp</a>
  </main>
  <script>
    // Funciona em github.io/Nome-do-repositorio/ e também em domínio próprio
    (function () {
      var h = location.hostname, seg = location.pathname.split('/')[1];
      var base = (/\.github\.io$/.test(h) && seg) ? '/' + seg + '/' : '/';
      document.getElementById('home').href = base;
    })();
  </script>
</body>
</html>
